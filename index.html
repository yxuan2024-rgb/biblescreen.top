<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Bible Screens — Scrollable Minimalist Bible Verses for MAC, Windows, iOS, & Android</title>
    <meta name="description" content="Maintain your faith continuity during daily life with zero cognitive load. Swipe through beautiful, full-screen minimalist Bible verses on Google Chrome. Work instantly across MAC, Windows, iOS, and Android with no app installation required." />
    <meta name="keywords" content="bible screens, biblescreen.top, daily bible verses, minimalist scriptures, web bible widgets, aesthetic scripture quotes, scroll bible online, web app bible, zero install bible" />
    <meta name="author" content="Bible Screens Developers" />
    <link rel="canonical" href="https://biblescreen.top/" />
    
    <!-- Open Graph / Social SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bible Screens — Scrollable Minimalist Bible Verses for Any Screen" />
    <meta property="og:description" content="Maintain your faith continuity. Beautiful vertical swipe verse cards inspired by Bible Widgets and TikTok. Works on MAC, Windows, iOS, and Android automatically." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1544644181-1484b3fdfc62?q=80&w=1200&auto=format&fit=crop" />
    <meta property="og:url" content="https://biblescreen.top/" />
    <meta property="og:site_name" content="Bible Screens" />

    <!-- Twitter Card SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bible Screens — Minimalist Bible Verses web app" />
    <meta name="twitter:description" content="No-install scrollable scripture cards working on Android Chrome, iOS Safari, macOS, and Windows PC instantly." />
    
    <!-- Structured Data (JSON-LD) for SEO Search Crawlers -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Bible Screens",
        "url": "https://biblescreen.top",
        "description": "An extremely minimalist Bible verse experience and spiritual devotional screen feed. Swipe through daily bible verses on Google Chrome with MAC, Windows, iOS, or Android. No installation required.",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "All (MAC, Windows, iOS, Android)",
        "browserRequirements": "Requires Google Chrome, Apple Safari, Mozilla Firefox, or Microsoft Edge",
        "offers": {
          "@type": "Offer",
          "price": "0.00",
          "priceCurrency": "USD"
        }
      }
    </script>
    
    <!-- PWA Install Support -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1c1917" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=180&auto=format&fit=crop" />

    <!-- Google Fonts Preconnect and Import (Lora Serif & Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..600;1,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      /* Smooth lock scrolls for full mobile experience */
      body {
        background-color: #0c0a09;
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite dev entry (http://localhost:3000). Direct file open uses the built bundle in dist/. -->
    <script>
      (function () {
        if (location.protocol !== 'file:') return;
        var path = decodeURIComponent(location.pathname.replace(/\\/g, '/'));
        if (path.endsWith('/dist/index.html')) return;
        window.location.replace(new URL('dist/index.html', document.baseURI).href);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
